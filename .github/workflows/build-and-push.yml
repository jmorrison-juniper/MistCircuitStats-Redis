name: Build and Push Multi-Arch Container

on:
  push:
    branches:
      - main
    tags:
      - '*.*.*.*.*'
  workflow_dispatch:

permissions: {}

jobs:
  # The shared workflow in misthelper-devtools builds the image with Buildx and
  # pushes it to GHCR. The version is YY.MM.DD.HH.MM in UTC, and it is also an
  # image tag.
  build-and-push:
    permissions:
      contents: read
      packages: write
    uses: jmorrison-juniper/misthelper-devtools/.github/workflows/reusable-container-image.yml@ca3659400847c35f5dac438c37fc5055c020910e # v0.2.0
    with:
      image-name: ${{ github.repository_owner }}/mistcircuitstats-redis
      tags: |
        type=ref,event=branch
        type=ref,event=pr
        type=ref,event=tag
        type=sha
        type=raw,value=latest,enable={{is_default_branch}}
      version-tag: true
      build-args: |
        BUILD_DATE={version}
        VERSION={version}