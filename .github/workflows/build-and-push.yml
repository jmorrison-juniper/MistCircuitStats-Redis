name: Build and Push Multi-Arch Container

on:
  push:
    branches:
      - main
    tags:
      - '*.*.*.*.*'
  workflow_dispatch:

permissions: {}

jobs:
  # The shared workflow in misthelper-devtools builds the image with Buildx and
  # pushes it to GHCR. The version is YY.MM.DD.HH.MM in UTC, and it is also an
  # image tag.
  build-and-push:
    permissions:
      contents: read
      packages: write
    uses: jmorrison-juniper/misthelper-devtools/.github/workflows/reusable-container-image.yml@da02d4c6a2163d1882f2ad25fce80b8ba38304d1 # v0.6.2
    with:
      image-name: ${{ github.repository_owner }}/mistcircuitstats-redis
      tags: |
        type=ref,event=branch
        type=ref,event=pr
        type=ref,event=tag
        type=sha
        type=raw,value=latest,enable={{is_default_branch}}
      version-tag: true
      build-args: |
        BUILD_DATE={version}
        VERSION={version}
